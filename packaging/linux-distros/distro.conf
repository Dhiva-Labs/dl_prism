# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh, in-container.sh and packaging/arch/aur.sh, with COMPONENT set to
# one of the two things this repository ships for Linux:
#
#   gateway  dl-prism: the prism gateway, a command-line server (its
#            dashboard is a web page), so .rpm, Arch package and PKGBUILD
#   desktop  dl-prism-desktop: the Flutter desktop companion, a GUI app, so
#            also an AppImage and a Flatpak. It starts the gateway (`prism`
#            on PATH): the .rpm and Arch package depend on dl-prism, and the
#            AppImage and Flatpak carry the gateway inside.

GITHUB_REPO=Dhiva-Labs/dl_prism
TAG_PREFIX=v                 # release tags are v<gateway version>
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/dl_prism
LICENSE=Apache-2.0
LICENSE_FILE=LICENSE
ARCH_INDEPENDENT=0
SMOKE_SECONDS=20

case "${COMPONENT:-}" in
  gateway)
    NAME=dl-prism
    SUMMARY='Local-first OpenAI-compatible AI gateway'
    DESCRIPTION='One OpenAI-compatible endpoint in front of every model you use, cloud or local, with manual and automatic routing, policy rules, failover and budget-aware cost tracking. The prism command serves the gateway and its embedded web dashboard.'
    # A static Go binary: no shared libraries, nothing it runs.
    RPM_REQUIRES=()
    ARCH_DEPENDS=()
    APPIMAGE=0
    # The workflow's own gateway run, against the installed package: version,
    # a routing dry run, then serve and read /healthz, /admin/status and the
    # dashboard.
    SMOKE_DEPS_DNF=(curl)
    SMOKE_DEPS_ZYPPER=(curl)
    SMOKE_DEPS_PACMAN=(curl)
    SMOKE_CMD='bash /linux-distros/smoke-gateway.sh'
    GUI_CMD=''
    ;;
  desktop)
    NAME=dl-prism-desktop
    APP_NAME=dl-prism-desktop
    SUMMARY='Desktop control tower for the DL Prism gateway'
    DESCRIPTION='Starts and stops the DL Prism gateway, shows its health, spend against budget and providers, connects cloud providers and manages local Ollama models. The dashboard opens in the browser (the engine variant, without WebKitGTK).'
    # The gateway it starts. Libraries (GTK 3 and friends) come from the ELF
    # files.
    RPM_REQUIRES=(/usr/bin/prism)
    ARCH_DEPENDS=(dl-prism gtk3)
    APPIMAGE=1
    EXEC=usr/lib/dl-prism-desktop/desktop
    DESKTOP=usr/share/applications/com.dhivalabs.prism.desktop.desktop
    ICON=usr/share/icons/hicolor/192x192/apps/com.dhivalabs.prism.desktop.png
    # The AppImage carries the gateway in usr/bin (APPIMAGE_MERGE_TREE).
    APPRUN_ENV='export PATH="$here/usr/bin:$PATH"'
    # The repository's own Xvfb smoke test (tool/smoke_xvfb.sh): the window
    # appears, the AOT snapshot (libapp.so) is mapped, and a screenshot shows
    # a rendered screen.
    SMOKE_DEPS_DNF=(xdotool ImageMagick)
    SMOKE_DEPS_ZYPPER=(xdotool ImageMagick)
    SMOKE_DEPS_PACMAN=(xdotool imagemagick)
    SMOKE_CMD='bash /linux-distros/smoke-desktop.sh dl-prism-desktop'
    GUI_CMD='dl-prism-desktop'
    ;;
  *) echo "set COMPONENT to gateway or desktop" >&2; return 2 2> /dev/null || exit 2 ;;
esac
