name: Builds

# Release-style builds for Linux and Windows on x64 and arm64:
#
#   desktop   Flutter companion app (integrations/desktop), Linux only, both
#             variants (full = embedded WebKitGTK dashboard, engine = browser only)
#   gateway   the Go gateway (cmd/prism): Linux and Windows, amd64 and arm64
#   distros   both repackaged for other Linux distributions: .rpm, Arch
#             packages and AUR recipes, plus an AppImage and a Flatpak of the
#             desktop companion with the gateway inside
#
# Every leg builds on a runner of its own architecture, so what it builds is
# also what it runs. On a published release all of it is attached to the release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  # The gateway embeds the dashboard (ui/dist). The committed copy would build,
  # but release binaries should carry a dashboard built from this commit.
  ui:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Compare with the committed dashboard
        working-directory: .
        run: |
          git status --short ui/dist
          git diff --stat -- ui/dist | tail -n 5
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    defaults:
      run:
        working-directory: integrations/desktop
    env:
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # libwebkit2gtk-4.1-dev: the full variant (desktop_webview_window) needs it.
      # xvfb, xauth, xdotool, dbus-x11, imagemagick: the smoke run below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev \
            libgl1-mesa-dri libegl1 \
            file binutils xvfb xauth xdotool dbus-x11 imagemagick

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      # Builds both variants into dist/ (the engine one with the webview
      # dependency removed), then puts the tree back to the full configuration.
      - name: Build both variants
        run: tool/build_variants.sh

      - name: Assert every ELF file in both bundles is ${{ matrix.elf_machine }}
        run: |
          for v in full engine; do
            for f in desktop lib/libapp.so lib/libflutter_linux_gtk.so; do
              [ -f "dist/dl-prism-desktop-$v/$f" ] || { echo "::error::missing dist/dl-prism-desktop-$v/$f"; exit 1; }
            done
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find dist -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 8 ] && [ "$bad" -eq 0 ]

      # The two variants differ in one thing: whether the WebKitGTK plugin is
      # part of the bundle. With the linker's --as-needed default the runner
      # executable itself may not record the dependency, so check the plugin.
      - name: Check the variants' WebKitGTK linkage
        run: |
          readelf -d dist/dl-prism-desktop-full/desktop | grep NEEDED
          plugin=dist/dl-prism-desktop-full/lib/libdesktop_webview_window_plugin.so
          [ -f "$plugin" ] || { echo "::error::$plugin missing"; exit 1; }
          readelf -d "$plugin" | grep -q 'NEEDED.*libwebkit2gtk-4.1' \
            || { echo "::error::$plugin does not need libwebkit2gtk-4.1"; exit 1; }
          [ ! -e dist/dl-prism-desktop-engine/lib/libdesktop_webview_window_plugin.so ] \
            || { echo "::error::the engine variant ships the webview plugin"; exit 1; }
          bad=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in ELF*) ;; *) continue ;; esac
            if readelf -d "$f" | grep -q 'NEEDED.*webkit'; then
              echo "::error file=$f::the engine variant links WebKitGTK"
              bad=1
            fi
          done < <(find dist/dl-prism-desktop-engine -type f -print0)
          [ "$bad" -eq 0 ]
          echo "full links WebKitGTK, engine does not"

      - name: Package tarballs
        run: |
          tool/package_linux.sh dist/tarballs
          ls -l dist/tarballs
          [ "$(ls dist/tarballs | wc -l)" -eq 2 ]

      - name: Unpack the tarballs and smoke-run them (Xvfb)
        timeout-minutes: 8
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          ARCH='${{ matrix.arch }}'
          for v in full engine; do
            NAME="dl-prism-desktop-$v-${VERSION}-linux-${ARCH}"
            tar -xzf "dist/tarballs/$NAME.tar.gz" -C "$RUNNER_TEMP"
            file "$RUNNER_TEMP/$NAME/desktop" | tee /dev/stderr | grep "$ELF_MACHINE"
            tool/smoke_xvfb.sh "$RUNNER_TEMP/$NAME/desktop" '^DL Prism Desktop$' "$RUNNER_TEMP/shots/$v-$ARCH.png"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: integrations/desktop/dist/tarballs/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots-${{ matrix.arch }}
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error
          retention-days: 7

  gateway:
    name: Gateway ${{ matrix.os }}/${{ matrix.goarch }}
    needs: ui
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: ''
            machine: x86-64
          - os: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: ''
            machine: ARM aarch64
          - os: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
            machine: '0x8664'
          - os: windows
            goarch: arm64
            runner: windows-11-arm
            ext: .exe
            machine: '0xAA64'
    defaults:
      run:
        shell: bash
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show the toolchain
        run: |
          go version
          go env GOOS GOARCH GOHOSTARCH CGO_ENABLED

      # Same flags as `make release`; VERSION comes from the Makefile.
      - name: Build
        run: |
          VERSION="$(sed -n 's/^VERSION ?= *//p' Makefile)"
          [ -n "$VERSION" ]
          mkdir -p dist
          OUT="dist/prism-${VERSION}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$OUT" ./cmd/prism
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l dist

      - name: Assert the binary is ${{ matrix.goarch }} (ELF)
        if: matrix.os == 'linux'
        run: |
          file "$OUT" | tee /dev/stderr | grep '${{ matrix.machine }}'

      - name: Assert the binary is ${{ matrix.goarch }} (PE machine ${{ matrix.machine }})
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $fs = [IO.File]::OpenRead((Resolve-Path $env:OUT))
          try {
            $br = New-Object IO.BinaryReader($fs)
            $fs.Position = 0x3C
            $fs.Position = $br.ReadInt32()
            if ($br.ReadUInt32() -ne 0x4550) { throw "$env:OUT is not a PE file" }
            $machine = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          'PE machine 0x{0:X4}' -f $machine
          if ($machine -ne [Convert]::ToUInt16('${{ matrix.machine }}', 16)) { throw "wrong PE machine" }

      # The repo's own Go suite, on the leg's own architecture. The race
      # detector exists on linux and windows/amd64 only. internal/workbench is
      # left out on Windows: its tests assume a POSIX host (/etc/passwd, /tmp,
      # a scrubbed POSIX environment) and failed on windows/arm64 for that
      # reason, not because of the CPU.
      - name: Test
        run: |
          pkgs="./..."
          if [ "$GOOS" = windows ]; then
            pkgs="$(go list ./... | grep -v '/internal/workbench$')"
          fi
          if [ "$GOOS/$GOARCH" = windows/arm64 ]; then
            go test $pkgs
          else
            go test -race $pkgs
          fi

      # Run the binary that was just built: version, a routing dry-run from the
      # example config, then serve it and read /healthz, /admin/status and the
      # embedded dashboard.
      - name: Run the gateway
        timeout-minutes: 5
        run: |
          "$OUT" version | tee version.txt
          grep -qx "prism ${VERSION}" version.txt
          "$OUT" explain -c prism.example.yaml "Write a Python dedupe function"
          "$OUT" serve -c prism.example.yaml --listen 127.0.0.1:18130 --offline > serve.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18130/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18130/healthz
          curl -fsS http://127.0.0.1:18130/admin/status | tee status.json
          grep -Eq "\"version\": *\"${VERSION}\"" status.json
          curl -fsS http://127.0.0.1:18130/ | grep -qi '<div id="root"'
          kill "$pid" || true
          cat serve.log

      - uses: actions/upload-artifact@v7
        with:
          name: gateway-${{ matrix.os }}-${{ matrix.goarch }}
          path: dist/prism-*
          if-no-files-found: error

  # Packages for distributions beyond Debian/Ubuntu, from what the jobs
  # above built and tested: the gateway as dl-prism (.rpm, Arch package; a
  # command-line server) and the desktop companion's engine variant as
  # dl-prism-desktop (.rpm, Arch package, AppImage carrying the gateway).
  # Each is installed on its real distribution and run there
  # (packaging/linux-distros/).
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [desktop, gateway]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, goarch: amd64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, goarch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: gateway-linux-${{ matrix.goarch }}
          path: gateway

      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: desktop

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build .rpm, Arch packages and AppImage
        run: |
          GATEWAY="$(sed -n 's/^VERSION ?= *//p' Makefile)"
          DESKTOP="$(grep '^version:' integrations/desktop/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          gw="$RUNNER_TEMP/gateway-root"
          dt="$RUNNER_TEMP/desktop-root"
          COMPONENT=gateway packaging/linux-distros/make-tree.sh \
            "gateway/prism-$GATEWAY-linux-${{ matrix.goarch }}" "$gw"
          COMPONENT=gateway VERSION="$GATEWAY" packaging/linux-distros/pack.sh "$gw" ${{ matrix.deb_arch }} dist/gateway
          COMPONENT=desktop packaging/linux-distros/make-tree.sh \
            "desktop/dl-prism-desktop-engine-$DESKTOP-linux-${{ matrix.arch }}.tar.gz" "$dt"
          COMPONENT=desktop VERSION="$DESKTOP" APPIMAGE_MERGE_TREE="$gw" \
            packaging/linux-distros/pack.sh "$dt" ${{ matrix.deb_arch }} dist/desktop
          # The Flatpak job builds from both trees; tar keeps modes and symlinks.
          mkdir "$RUNNER_TEMP/flatpak-tree"
          cp -a "$gw/." "$dt/." "$RUNNER_TEMP/flatpak-tree/"
          tar -C "$RUNNER_TEMP/flatpak-tree" -cJf "$RUNNER_TEMP/tree.tar.xz" .

      # The companion's packages depend on the gateway's, so its checks
      # install both together.
      - name: Install and run on Fedora, openSUSE and Arch
        timeout-minutes: 25
        run: |
          COMPONENT=gateway packaging/linux-distros/verify.sh dist/gateway ${{ matrix.deb_arch }}
          COMPONENT=desktop WITH_PKGS=dist/gateway packaging/linux-distros/verify.sh dist/desktop ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*/*.rpm
            dist/*/*.pkg.tar.zst
            dist/*/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

  # AUR recipes: PKGBUILD + .SRCINFO for dl-prism-bin and
  # dl-prism-desktop-bin, rendered with the checksums of this run's release
  # files and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILDs
    needs: [desktop, gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: gateway-linux-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-linux-*
          path: assets
          merge-multiple: true

      - name: Render and check the PKGBUILDs
        run: |
          export GATEWAY_VERSION="$(sed -n 's/^VERSION ?= *//p' Makefile)"
          export DESKTOP_VERSION="$(grep '^version:' integrations/desktop/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          packaging/arch/aur.sh \
            "assets/prism-$GATEWAY_VERSION-linux-amd64" "assets/prism-$GATEWAY_VERSION-linux-arm64" \
            "assets/dl-prism-desktop-engine-$DESKTOP_VERSION-linux-x64.tar.gz" \
            "assets/dl-prism-desktop-engine-$DESKTOP_VERSION-linux-arm64.tar.gz" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Flatpak bundle of the companion with the gateway inside, built with
  # flatpak-builder in the Flathub CI image for its runtime (GNOME 51).
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: distros
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the installed trees
        id: v
        run: |
          mkdir -p packaging/flatpak/tree
          tar -xJf "$RUNNER_TEMP/tree.tar.xz" -C packaging/flatpak/tree
          echo "version=$(grep '^version:' integrations/desktop/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.dhivalabs.prism.desktop.yml
          bundle: dl-prism-desktop-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
          artifact-name: flatpak-${{ matrix.arch }}
          arch: ${{ matrix.fp_arch }}
          cache: false

  # Installs each bundle on a plain Ubuntu runner the way a user would (the
  # runtime comes from Flathub) and runs it in the sandbox.
  flatpak-test:
    name: Flatpak ${{ matrix.arch }} install and run
    needs: flatpak
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: flatpak-${{ matrix.arch }}
          path: bundle

      - name: Install Flatpak, Xvfb and the smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak xvfb xauth dbus dbus-x11 xdotool imagemagick curl
          # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04
          # restricts through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the bundle and run it
        timeout-minutes: 20
        run: packaging/flatpak/test-bundle.sh bundle/*.flatpak

  release:
    name: Release assets
    needs: [desktop, gateway, distros, aur, flatpak-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Makefile
            integrations/desktop/pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-linux-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: gateway-*
          path: assets
          merge-multiple: true

      # The other-distribution packages, the AUR recipes and the Flatpaks.
      # The distros artifacts keep their dist/<component>/ folders, so they
      # land apart and the check step moves their files into assets/.
      - uses: actions/download-artifact@v8
        with:
          pattern: distros-*
          path: distros
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          path: assets
          merge-multiple: true

      - name: Check the release assets
        run: |
          DESKTOP="$(grep '^version:' integrations/desktop/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          GATEWAY="$(sed -n 's/^VERSION ?= *//p' Makefile)"
          mv distros/gateway/* distros/desktop/* assets/
          ls -l assets
          expected="
          dl-prism-desktop-full-${DESKTOP}-linux-x64.tar.gz
          dl-prism-desktop-full-${DESKTOP}-linux-arm64.tar.gz
          dl-prism-desktop-engine-${DESKTOP}-linux-x64.tar.gz
          dl-prism-desktop-engine-${DESKTOP}-linux-arm64.tar.gz
          prism-${GATEWAY}-linux-amd64
          prism-${GATEWAY}-linux-arm64
          prism-${GATEWAY}-windows-amd64.exe
          prism-${GATEWAY}-windows-arm64.exe
          dl-prism-${GATEWAY}-1.x86_64.rpm
          dl-prism-${GATEWAY}-1.aarch64.rpm
          dl-prism-${GATEWAY}-1-x86_64.pkg.tar.zst
          dl-prism-${GATEWAY}-1-aarch64.pkg.tar.zst
          dl-prism-bin-${GATEWAY}-aur.tar.gz
          dl-prism-desktop-${DESKTOP}-1.x86_64.rpm
          dl-prism-desktop-${DESKTOP}-1.aarch64.rpm
          dl-prism-desktop-${DESKTOP}-1-x86_64.pkg.tar.zst
          dl-prism-desktop-${DESKTOP}-1-aarch64.pkg.tar.zst
          dl-prism-desktop-${DESKTOP}-x86_64.AppImage
          dl-prism-desktop-${DESKTOP}-aarch64.AppImage
          dl-prism-desktop-${DESKTOP}-x86_64.flatpak
          dl-prism-desktop-${DESKTOP}-aarch64.flatpak
          dl-prism-desktop-bin-${DESKTOP}-aur.tar.gz"
          for f in $expected; do
            [ -f "assets/$f" ] || { echo "::error::missing assets/$f"; exit 1; }
          done
          [ "$(ls assets | wc -l)" -eq 22 ]
          if [ -n "$TAG" ] && [ "$TAG" != "v$GATEWAY" ]; then
            echo "::warning::release tag $TAG differs from the gateway version $GATEWAY in the Makefile; asset names carry $GATEWAY"
          fi

      # Hand-uploaded assets win: names already on the release are skipped.
      - name: Upload to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
          for f in assets/*; do
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qxF -- "$name"; then
              echo "skip $name (already on the release)"
            else
              echo "upload $name"
              gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
            fi
          done
